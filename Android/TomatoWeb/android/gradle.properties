org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

org.gradle.parallel=false
org.gradle.workers.max=2
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# —— 本机专属配置（代理 / 镜像 / IPv4 偏好）请放到用户级文件，别提交 ——
# ~/.gradle/gradle.properties 或构建时 -D 传入，例如国内代理构建：
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=18080
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=18080
#   -Djava.net.preferIPv4Stack=true
