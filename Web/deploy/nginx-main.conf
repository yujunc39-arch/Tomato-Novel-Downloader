# 番茄多租户网关 - nginx 配置
# 由 instances.render_nginx() 负责生成用户子域名部分(写入 /etc/nginx/sites-available/tomato-users)

# ---- 主站：tomato.898954782.xyz -> 网关 127.0.0.1:18080 ----
server {
    listen 443 ssl http2;
    server_name tomato.898954782.xyz;

    ssl_certificate     /etc/letsencrypt/live/tomato.898954782.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomato.898954782.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200m;

    # 公告脚本不缓存：保证逻辑更新后立即生效（且它依赖真人校验门标志）
    location = /static/announce.js {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter '</head>' '<script src="/static/announce.js?v=3"></script></head>';
        sub_filter_once on;
    }
}

# HTTP -> HTTPS 跳转 (主站)
server {
    listen 80;
    server_name tomato.898954782.xyz;
    return 301 https://$host$request_uri;
}
