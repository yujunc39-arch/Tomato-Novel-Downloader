# 兜底: 只允许 tomato.898954782.xyz 及其子域名访问
# 通过 IP 直连 / 未知域名(Host 不匹配) 一律掐断连接

server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/tomato.898954782.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomato.898954782.xyz/privkey.pem;

    return 444;
}
