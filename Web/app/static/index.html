<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄小说下载器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fdf2e9,#fff4e6);min-height:100vh;color:#3d2b1f}
.container{max-width:460px;margin:0 auto;padding:24px}
.logo{text-align:center;margin:40px 0 24px}
.logo .icon{font-size:52px}
.logo h1{font-size:26px;margin-top:8px;color:#e8590c}
.logo p{color:#8a6d54;margin-top:6px;font-size:14px}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(230,120,30,.12)}
.card h2{font-size:18px;margin-bottom:20px;color:#4a2c18}
.input{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:10px;font-size:15px;margin-bottom:14px;outline:none;transition:.2s}
.input:focus{border-color:#e8590c}
.btn{width:100%;padding:13px;background:#e8590c;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{background:#d9480f}
.btn.secondary{background:#f1f3f5;color:#4a2c18;margin-top:10px}
.tab{display:flex;margin-bottom:22px;background:#f8f9fa;border-radius:10px;padding:4px}
.tab button{flex:1;padding:10px;border:none;background:transparent;border-radius:8px;font-size:14px;cursor:pointer;color:#8a6d54}
.tab button.active{background:#fff;color:#e8590c;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.msg{text-align:center;margin-top:12px;font-size:14px;min-height:20px}
.msg.err{color:#e03131}.msg.ok{color:#2f9e44}
.hidden{display:none}
.dash{margin-top:8px}
.stat{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;display:flex;align-items:center;box-shadow:0 6px 24px rgba(230,120,30,.08)}
.stat .num{font-size:32px;font-weight:700;color:#e8590c;margin-right:16px}
.stat .label{font-size:14px;color:#8a6d54}
.launch{background:linear-gradient(135deg,#e8590c,#f76707);color:#fff;border:none;border-radius:12px;padding:16px;width:100%;font-size:16px;font-weight:600;cursor:pointer;margin:14px 0;box-shadow:0 6px 20px rgba(232,89,12,.3)}
.launch:hover{filter:brightness(1.05)}
.link{color:#e8590c;text-decoration:none;font-size:14px}
.logout{margin-top:20px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px}
.box h3{font-size:16px;color:#4a2c18;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.box .close{cursor:pointer;color:#bbb;font-weight:700;padding:0 4px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="icon">🍅</div>
    <h1>番茄小说下载器</h1>
    <p>在线搜索 · 下载 · 阅读、多用户专属空间</p>
  </div>

  <!-- 登录/注册 -->
  <div class="card" id="authCard">
    <div class="tab">
      <button id="tabLogin" class="active" onclick="showTab('login')">登录</button>
      <button id="tabReg" onclick="showTab('reg')">注册</button>
    </div>
    <div id="loginForm">
      <input class="input" id="loginUser" placeholder="用户名">
      <input class="input" id="loginPass" type="password" placeholder="密码">
      <button class="btn" onclick="login()">登录</button>
      <div class="msg" id="loginMsg"></div>
      <div style="text-align:center;margin-top:12px;display:flex;justify-content:center;gap:18px">
        <a class="link" href="#" onclick="forgotPw();return false" style="font-size:13px">忘记密码？</a>
        <a class="link" href="#" onclick="downloadApp();return false" style="font-size:13px">📱 软件下载</a>
      </div>
    </div>
    <div id="regForm" class="hidden">
      <input class="input" id="regUser" placeholder="用户名(至少2字符)">
      <input class="input" id="regPass" type="password" placeholder="密码(至少6位)">
      <input class="input" id="regPass2" type="password" placeholder="确认密码">
      <button class="btn" onclick="register()">注册并进入</button>
      <div class="msg" id="regMsg"></div>
    </div>
  </div>

  <!-- 登录后 -->
  <div class="dash hidden" id="dashCard">
    <div class="stat">
      <div class="num" id="dashPort">—</div>
      <div class="label">我的专属端口</div>
    </div>
    <div class="stat">
      <div class="num" id="dashSub">—</div>
      <div class="label">我的专属地址</div>
    </div>
    <button class="launch" id="launchBtn" onclick="launch()">🚀 启动我的下载空间</button>
    <div id="enterWrap" class="hidden" style="margin:14px 0">
      <a id="enterLink" class="launch" style="display:block;text-align:center;text-decoration:none" target="_blank">进入我的下载空间 →</a>
    </div>
    <div class="msg" id="dashMsg"></div>
    <div class="logout" style="display:flex;justify-content:center;gap:18px">
      <a class="link" href="#" onclick="openPwd();return false">修改密码</a>
      <a class="link" href="#" onclick="logout()">退出登录</a>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal" id="pwdModal">
  <div class="box">
    <h3>修改密码 <span class="close" onclick="closePwd()">✕</span></h3>
    <input class="input" id="oldPwd" type="password" placeholder="当前密码">
    <input class="input" id="newPwd" type="password" placeholder="新密码(6-72位)">
    <input class="input" id="newPwd2" type="password" placeholder="确认新密码">
    <button class="btn" onclick="doChangePwd()">确认修改</button>
    <div class="msg" id="pwdMsg"></div>
    <div style="font-size:12px;color:#a8927e;margin-top:8px">修改成功后需要重新登录。</div>
  </div>
</div>

<script>
const domain = window.location.hostname.replace(/^u\d+\./, '');
function showTab(t){
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active', t==='reg');
  document.getElementById('loginForm').classList.toggle('hidden', t!=='login');
  document.getElementById('regForm').classList.toggle('hidden', t!=='reg');
}
async function api(path, opts={}){
  const t = localStorage.getItem('token');
  const h = {'Content-Type':'application/json', ...(opts.headers||{})};
  if(t) h.Authorization = 'Bearer '+t;
  const r = await fetch(path, {...opts, headers:h});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||'请求失败');
  return d;
}
async function register(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value, p2=document.getElementById('regPass2').value;
  const msg=document.getElementById('regMsg');
  if(!u||!p){msg.className='msg err';msg.textContent='请填写用户名和密码';return;}
  if(p!==p2){msg.className='msg err';msg.textContent='两次密码不一致';return;}
  try{
    await api('/api/register',{method:'POST',body:JSON.stringify({username:u,password:p})});
    msg.className='msg ok';msg.textContent='注册成功，正在进入专属空间…';
    await doLogin(u,p);
    await launch();   // 自动启动并跳转
  }catch(e){msg.className='msg err';msg.textContent=e.message;}
}
async function login(){
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  const msg=document.getElementById('loginMsg');
  try{
    await doLogin(u,p);
    msg.className='msg ok';msg.textContent='登录成功';
  }catch(e){msg.className='msg err';msg.textContent=e.message;}
}
async function doLogin(u,p){
  const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
  localStorage.setItem('token',d.token);localStorage.setItem('username',d.username);
  await loadDash();
}
async function loadDash(){
  const d=await api('/api/me');
  document.getElementById('authCard').classList.add('hidden');
  document.getElementById('dashCard').classList.remove('hidden');
  document.getElementById('dashPort').textContent=d.subdomain;
  document.getElementById('dashSub').textContent=d.subdomain+'.'+domain;
  // 显示实例状态与启动时间
  const dm=document.getElementById('dashMsg');
  if(dm && d.running && d.started_at){
    dm.className='msg ok';
    dm.textContent='✅ 空间已启动 · 启动于 '+fmtBJ(d.started_at);
  }
}
function fmtBJ(ts){
  const d=new Date(ts*1000), p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function launch(){
  const msg=document.getElementById('dashMsg');
  const btn=document.getElementById('launchBtn');
  try{
    btn.disabled=true;
    msg.className='msg ok';msg.textContent='正在启动专属空间…(首次约需几秒，请稍候)';
    const d=await api('/api/me/start',{method:'POST'});
    const url='https://'+d.subdomain+'.'+domain;
    msg.className='msg ok';
    msg.textContent='✅ 已启动'+(d.started_at?('（启动于 '+fmtBJ(d.started_at)+'）'):'')+'！正在进入…';
    // 显示可点击链接(双保险)
    const wrap=document.getElementById('enterWrap');
    const link=document.getElementById('enterLink');
    link.href=url; wrap.classList.remove('hidden');
    // 直接跳转(不会被弹窗拦截)
    setTimeout(()=>{ window.location.href=url; }, 500);
  }catch(e){msg.className='msg err';msg.textContent=e.message; btn.disabled=false;}
}
function logout(){localStorage.removeItem('token');api('/api/logout',{method:'POST'}).catch(()=>{}).finally(()=>location.reload());}
function forgotPw(){
  const m=document.getElementById('loginMsg');
  m.className='msg err';
  m.textContent='忘记密码请联系管理员(lin)，由管理员在后台帮你重置新密码';
}
function downloadApp(){
  if(!confirm('此软件仅限安卓(Android)设备使用。\n是否继续下载？')) return;
  window.location.href='/api/download/app';
}
function openPwd(){document.getElementById('pwdModal').classList.add('show');document.getElementById('pwdMsg').textContent='';}
function closePwd(){document.getElementById('pwdModal').classList.remove('show');}
async function doChangePwd(){
  const o=document.getElementById('oldPwd').value, n1=document.getElementById('newPwd').value, n2=document.getElementById('newPwd2').value;
  const m=document.getElementById('pwdMsg');
  if(!o||!n1){m.className='msg err';m.textContent='请填写完整';return;}
  if(n1!==n2){m.className='msg err';m.textContent='两次新密码不一致';return;}
  try{
    const d=await api('/api/me/change_password',{method:'POST',body:JSON.stringify({old_password:o,new_password:n1})});
    m.className='msg ok';m.textContent='✅ 修改成功，正在退出登录…';
    setTimeout(()=>{localStorage.removeItem('token');api('/api/logout',{method:'POST'}).finally(()=>location.reload());},1200);
  }catch(e){m.className='msg err';m.textContent='❌ '+e.message;}
}
// 自动登录: 直接用 cookie 尝试 /api/me(不依赖 localStorage token)
api('/api/me').then(loadDash).catch(()=>{});
// 被鉴权拦截弹回登录页时给出提示
if(location.search.includes('need_login')){
  const m=document.getElementById('loginMsg');
  if(m){
    m.className='msg err';
    m.textContent = location.search.includes('need_login=admin')
      ? '请用管理员账号登录后访问管理后台'
      : '请先登录，再访问你的专属空间';
  }
}
// 实例未启动被弹回 -> 显示面板并提示用户自己启动
if(location.search.includes('need_start')){
  const dm=document.getElementById('dashMsg');
  if(dm){ dm.className='msg'; dm.textContent='⚠️ 你的下载空间还没启动，点击上方按钮启动'; }
}
</script>
</body>
</html>
